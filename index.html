<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치이카와 RUN!!!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Phaser 3 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    
    <!-- Firebase SDK (v9 Compatibility Build) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { font-family: 'Noto Sans KR', sans-serif; box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; }
        
        .app-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transform: translateX(120px);
        }

        #game-container { 
            position: relative; 
            width: 800px; 
            height: 450px; 
            overflow: hidden; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #game-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #external-leaderboard {
            width: 220px;
            height: 450px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        #external-leaderboard h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #facc15;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        #in-game-leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        #in-game-leaderboard-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 8px;
            margin-bottom: 5px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        #in-game-leaderboard-list li.my-rank-item {
            border: 2px solid #facc15;
            background: #422006;
            color: #facc15;
            font-weight: bold;
        }

        #in-game-leaderboard-list li.ellipsis-item {
            justify-content: center;
            background: transparent;
            border: none;
            color: #64748b;
            font-weight: bold;
            padding: 2px 0;
        }

        #in-game-leaderboard-list li.empty-msg {
            justify-content: center;
            color: #94a3b8;
            padding: 20px 0;
            border: none;
            background: transparent;
        }

        .rank-name-box { max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-time-box { color: #38bdf8; font-weight: bold; }

        #key-display { display: flex; gap: 15px; margin-top: 15px; background: #1e293b; padding: 10px 25px; border-radius: 12px; border: 2px solid #334155; }
        .key-btn { padding: 8px 16px; background: #0f172a; border: 2px solid #475569; border-radius: 8px; font-weight: 700; font-size: 14px; color: #94a3b8; transition: all 0.1s ease; }
        .key-btn.active { background: #38bdf8; color: #0f172a; border-color: #7dd3fc; box-shadow: 0 0 10px #38bdf8; transform: translateY(-2px); }
        .overlay { position: absolute; top: 0; left: 0; width: 800px; height: 450px; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .btn-ui { padding: 12px 28px; font-size: 18px; font-weight: 700; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 15px; }
        .btn-ui:hover { background: #38bdf8; transform: scale(1.05); }
        .ranking-box { width: 80%; max-height: 180px; overflow-y: auto; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin: 10px 0; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; margin: 3px 0; border-radius: 4px; font-size: 14px; background: #0f172a; }
        .rank-item.my-rank { border: 2px solid #facc15; background: #422006; color: #facc15; font-weight: 700; }
        input[type="text"] { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; margin: 2px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="game-container">
        <div id="start-overlay" class="overlay">
            <h1 style="color: #facc15; margin-bottom: 5px;">🏃‍♂️ 치이카와 RUN!!!</h1>
            <p style="color: #94a3b8; margin-bottom: 15px;">오직 기록(초)만이 승자입니다! 빠른 시간 안에 완주하세요.</p>
            <p style="color: #38bdf8; font-weight: bold; margin-bottom: 20px;">[ SPACE ] 키를 누르거나 아래 버튼을 눌러 시작하세요</p>
            <button id="start-btn" class="btn-ui">🎮 게임 시작 (SPACE)</button>
        </div>

        <div id="result-overlay" class="overlay" style="display: none;">
            <h2 id="result-title" style="margin: 5px; color: #facc15;">결과</h2>
            <p id="result-detail" style="color: #38bdf8; font-weight: bold; font-size: 20px; margin: 5px;">완주 기록: 00분 00초 00</p>
            
            <div id="name-input-section" style="margin: 10px 0; text-align: center;">
                <input type="text" id="player-name" placeholder="닉네임 (최대 6자)" maxlength="6">
                <input type="text" id="player-comment" placeholder="한마디 (최대 15자)" maxlength="15">
                <button id="save-rank-btn" class="btn-ui" style="padding: 8px 16px; font-size: 14px;">기록 등록</button>
            </div>

            <div class="ranking-box" id="ranking-list"></div>

            <button id="restart-btn" class="btn-ui">🔄 다시 시작 (SPACE)</button>
        </div>
    </div>

    <div id="external-leaderboard">
        <h3>🏆 실시간 랭킹 (TOP 10)</h3>
        <ul id="in-game-leaderboard-list"></ul>
    </div>
</div>

<div id="key-display">
    <div class="key-btn" id="key-left">◀ 뒤 (LEFT)</div>
    <div class="key-btn" id="key-right">앞 (RIGHT) ▶</div>
    <div class="key-btn" id="key-space">SPACE (점프/시작)</div>
    <div class="key-btn" id="key-ctrl">CTRL (대시)</div>
</div>

<script>
// ==========================================
// 1. Firebase Realtime Database 간단 초기화
// ==========================================
const firebaseConfig = {
    databaseURL: "https://chiikawa-run-default-rtdb.firebaseio.com/" // 👈 본인의 DB URL로 교체하세요
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const rankRef = database.ref('rankings');

// ==========================================
// 2. Phaser 게임 설정
// ==========================================
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 2200 }, debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

let game;
let currentBaseSpeed = 320; 
const DASH_SPEED = 550;
const EXHAUSTED_SPEED = 200;
const FINISH_X = 35000;

const SAFE_SINGLE_JUMP_HEIGHT = 66;   
const SAFE_DOUBLE_JUMP_HEIGHT = 140;  

let player, bg, groundGroup, obstacles, items, swingObstacles, finishLine;
let cursors, ctrlKey, spaceKey;

let isGroggy = false, isExhausted = false, isInvincible = false, isSuperDashing = false;
let dashEnergy = 1.0, exhaustedTimer = 0, jumpCount = 0;
let groggyTime = 0, canInstantRecover = false;
let isGameFinished = true; 

let invincibleEventTimer = null;
let spawnedItemCount = 0;
let startTime = 0, finalRecordTime = 0;
let lastSavedRecordId = null;

let uiPanel, timerText, statusText;
let miniMapBg, progressBarFill, progressMiniPlayer, miniMapInfoText;
let dashBarBg, dashBarFill, headStatusText;
let speedLineGraphics, exhaustedOverlay;
let isPitStunned = false;
let afterimageTimer = 0;

let currentLeaderboardCache = [];

function formatTime(totalSeconds) {
    let ts = Math.max(0, totalSeconds);
    let minutes = Math.floor(ts / 60);
    let seconds = Math.floor(ts % 60);
    let centis = Math.floor((ts - Math.floor(ts)) * 100);
    let pad = (n) => n.toString().padStart(2, '0');
    return `${pad(minutes)}분 ${pad(seconds)}초 ${pad(centis)}`;
}

function preload() {
    // ⭕ assets/ 폴더 경로 지정
   this.load.image('player_run1', './assets/run1.png');
    this.load.image('obstacle1', './assets/obstacle1.png'); 
    this.load.image('obstacle2', './assets/obstacle2.png');
    
    let g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x38bdf8); g.fillRect(0, 0, 40, 50); g.generateTexture('playerDummy', 40, 50); g.clear();
    g.fillStyle(0x8d5b4c); g.fillRect(0, 0, 40, SAFE_SINGLE_JUMP_HEIGHT); g.generateTexture('obstacleTexture', 40, SAFE_SINGLE_JUMP_HEIGHT); g.clear();
    g.fillStyle(0x5c3a30); g.fillRect(0, 0, 40, SAFE_DOUBLE_JUMP_HEIGHT); g.generateTexture('obstacle2Texture', 40, SAFE_DOUBLE_JUMP_HEIGHT); g.clear();

    g.fillStyle(0xef4444); g.fillCircle(18, 18, 18); g.fillStyle(0xffffff); g.fillCircle(18, 18, 6);
    g.generateTexture('tarzanDummy', 36, 36); g.clear();

    g.fillStyle(0xa855f7); g.fillCircle(14, 14, 14); g.fillStyle(0xffffff); g.fillCircle(14, 14, 6); 
    g.generateTexture('itemGiantDummy', 28, 28); g.clear();

    g.fillStyle(0x2ecc71); g.fillRect(0, 0, 15, 400); g.generateTexture('finishDummy', 15, 400); g.clear();
    g.fillStyle(0xef4444); g.beginPath(); g.moveTo(0,0); g.lineTo(16,8); g.lineTo(0,16); g.closePath(); g.fillPath();
    g.lineStyle(2, 0xffffff); g.lineBetween(0,0,0,24); g.generateTexture('flagDummy', 20, 26); g.clear();

    g.fillStyle(0x1e293b); g.fillRect(0, 0, 400, 450);
    g.lineStyle(1, 0x334155, 0.4);
    for(let i=0; i<400; i+=40) g.lineBetween(i,0,i,450);
    g.generateTexture('bgDummy', 400, 450); g.clear();
}

function create() {
    this.physics.world.setBounds(0, -200, FINISH_X + 800, 800);
    bg = this.add.tileSprite(400, 225, 800, 450, 'bgDummy').setScrollFactor(0);

    groundGroup = this.physics.add.staticGroup();
    obstacles = this.physics.add.group({ immovable: true, allowGravity: false });
    items = this.physics.add.group({ immovable: true, allowGravity: false });
    swingObstacles = this.physics.add.group({ immovable: true, allowGravity: false });

    spawnedItemCount = 0;
    isPitStunned = false;
    let currentX = 0;

    while (currentX < FINISH_X - 1000) {
        let platformWidth = Phaser.Math.Between(1000, 1600);
        let gRect = this.add.rectangle(currentX + platformWidth/2, 420, platformWidth, 60, 0x334155);
        this.physics.add.existing(gRect, true);
        groundGroup.add(gRect);

        if (currentX > 800) {
            let obsX = currentX + Phaser.Math.Between(300, platformWidth - 300);
            let isDouble = Phaser.Math.Between(1, 10) > 7;
            let key = isDouble ? 'obstacle2' : 'obstacle1';
            let fallbackKey = isDouble ? 'obstacle2Texture' : 'obstacleTexture';
            let obsKey = this.textures.exists(key) ? key : fallbackKey;

            let obs = obstacles.create(obsX, 390, obsKey).setOrigin(0.5, 1);
            if (!isDouble && obsKey === 'obstacle1') obs.setFlipX(true);

            let targetMaxHeight = isDouble ? SAFE_DOUBLE_JUMP_HEIGHT : SAFE_SINGLE_JUMP_HEIGHT;
            let scale = targetMaxHeight / obs.height;
            obs.setScale(scale);

            obs.body.setSize(obs.width * 0.6, obs.height * 0.8);
            obs.body.setOffset(obs.width * 0.2, obs.height * 0.2);

            if (Phaser.Math.Between(1, 10) > 6) {
                let swingX = currentX + Phaser.Math.Between(200, platformWidth - 200);
                createTarzanObstacle.call(this, swingX, 80);
            }

            if (spawnedItemCount < 4 && Phaser.Math.Between(1, 10) > 7) {
                let itm = items.create(obsX + 250, 310, 'itemGiantDummy');
                itm.body.setSize(28, 28);
                spawnedItemCount++;
            }
        }
        currentX += platformWidth + Phaser.Math.Between(120, 180);
    }

    let finalGround = this.add.rectangle(FINISH_X, 420, 2000, 60, 0x334155);
    this.physics.add.existing(finalGround, true);
    groundGroup.add(finalGround);

    let playerKey = this.textures.exists('player_run1') ? 'player_run1' : 'playerDummy';
    player = this.physics.add.sprite(150, 300, playerKey);
    player.setScale(0.35); 
    player.body.setSize(player.width * 0.5, player.height * 0.75);
    player.setDepth(10);

    this.cameras.main.setBounds(0, 0, FINISH_X + 500, 450);
    this.cameras.main.startFollow(player, true, 0.1, 0.1);

    speedLineGraphics = this.add.graphics().setDepth(5);
    finishLine = this.physics.add.sprite(FINISH_X, 200, 'finishDummy');
    finishLine.body.setAllowGravity(false);

    this.physics.add.collider(player, groundGroup, () => { jumpCount = 0; });
    this.physics.add.collider(player, obstacles, handleObstacleCollision, null, this);
    this.physics.add.overlap(player, swingObstacles, handleObstacleCollision, null, this);
    this.physics.add.overlap(player, items, collectItem, null, this);
    this.physics.add.overlap(player, finishLine, reachFinish, null, this);

    cursors = this.input.keyboard.createCursorKeys();
    ctrlKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.CTRL);
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    this.input.keyboard.on('keydown-SPACE', () => {
        if (isGameFinished) {
            let startOverlay = document.getElementById('start-overlay');
            let resultOverlay = document.getElementById('result-overlay');
            if (startOverlay.style.display !== 'none') {
                startOverlay.style.display = 'none';
                resetGameVars();
                startGameActual();
            } else if (resultOverlay.style.display !== 'none') {
                resultOverlay.style.display = 'none';
                resetGameVars();
                game.scene.scenes[0].scene.restart();
                startGameActual();
            }
            return;
        }

        if (isPitStunned) return;

        if (isGroggy) {
            if (canInstantRecover && (this.time.now - groggyTime <= 120)) { 
                triggerExplosiveSuperJump.call(this); 
            }
            return;
        }

        if (player.body.blocked.down || jumpCount < 2) {
            jumpCount++;
            player.setVelocityY(jumpCount === 1 ? -650 : -580);
            createJumpEffect.call(this, player.x, player.y + 20);
        }
    });

    uiPanel = this.add.rectangle(110, 45, 190, 60, 0x0f172a, 0.85).setStrokeStyle(2, 0x38bdf8).setScrollFactor(0);
    timerText = this.add.text(20, 25, '기록: 00분 00초', { fontFamily: 'Noto Sans KR', fontSize: '16px', fill: '#38bdf8', fontWeight: 'bold' }).setScrollFactor(0);
    statusText = this.add.text(20, 50, '상태: 정상', { fontFamily: 'Noto Sans KR', fontSize: '12px', fill: '#34d399' }).setScrollFactor(0);

    miniMapBg = this.add.rectangle(520, 32, 240, 48, 0x0f172a, 0.9).setStrokeStyle(2, 0x38bdf8).setScrollFactor(0);
    this.add.rectangle(520, 40, 210, 10, 0x1e293b).setStrokeStyle(1, 0x475569).setScrollFactor(0);
    progressBarFill = this.add.rectangle(415, 40, 0, 10, 0x38bdf8).setOrigin(0, 0.5).setScrollFactor(0);
    progressMiniPlayer = this.add.image(415, 40, playerKey).setScale(0.06).setScrollFactor(0);
    this.add.image(625, 32, 'flagDummy').setScale(0.8).setOrigin(0.5, 1).setScrollFactor(0);

    miniMapInfoText = this.add.text(520, 16, '남은 거리: 1750m', {
        fontFamily: 'Noto Sans KR', fontSize: '11px', fill: '#38bdf8', fontWeight: 'bold'
    }).setOrigin(0.5).setScrollFactor(0);

    dashBarBg = this.add.rectangle(0, 0, 60, 8, 0x000000, 0.6);
    dashBarFill = this.add.rectangle(0, 0, 60, 6, 0x38bdf8).setOrigin(0, 0.5);
    headStatusText = this.add.text(0, 0, '', { fontFamily: 'Noto Sans KR', fontSize: '13px', fontWeight: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setVisible(false);
    exhaustedOverlay = this.add.rectangle(400, 225, 800, 450, 0xef4444, 0).setScrollFactor(0).setDepth(100);

    listenToRealtimeLeaderboard();
}

function createTarzanObstacle(pivotX, pivotY) {
    let lineGraphics = this.add.graphics();
    let swingObj = swingObstacles.create(pivotX, pivotY + 160, 'tarzanDummy');
    swingObj.body.setSize(26, 26);

    let angle = 0;
    this.events.on('postupdate', () => {
        if (!swingObj.active) return;
        angle += 0.035;
        swingObj.x = pivotX + Math.sin(angle) * 120;
        swingObj.y = pivotY + 160 + Math.cos(angle * 2) * 15;

        lineGraphics.clear();
        lineGraphics.lineStyle(2, 0x94a3b8, 0.8);
        lineGraphics.lineBetween(pivotX, pivotY, swingObj.x, swingObj.y);
    });
}

function update(time, delta) {
    updateKeyDisplay();
    if (isGameFinished) return;

    let deltaSec = delta / 1000;
    let elapsedTime = (this.time.now - startTime) / 1000;

    currentBaseSpeed = Math.min(520, 320 + elapsedTime * 3.0);
    bg.tilePositionX = this.cameras.main.scrollX * 0.3;

    let progressRatio = Math.min(1, Math.max(0, player.x / FINISH_X));
    let remainingMeters = Math.max(0, Math.floor((FINISH_X - player.x) / 20));
    let progressPercent = Math.floor(progressRatio * 100);

    progressBarFill.width = 210 * progressRatio;
    progressMiniPlayer.x = 415 + (210 * progressRatio);
    miniMapInfoText.setText(`남은 거리: ${remainingMeters}m (${progressPercent}%)`);

    if (isInvincible) {
        let rainbowColor = Phaser.Display.Color.HSVToRGB(((this.time.now / 4) % 360) / 360, 1, 1).color;
        player.setTint(rainbowColor);
        dashEnergy = 1.0;
        isExhausted = false;
        exhaustedOverlay.setAlpha(0);
    } else if (isSuperDashing) {
        player.setTint(0xffea00);
    }

    if (player.y > 500 && !isPitStunned) {
        isPitStunned = true;
        player.setVelocity(0, 0);
        player.setTint(0xef4444);
        showFloatingText.call(this, player.x, 300, '😵 구멍 낙사! 0.5초 스턴', '#ef4444');
        
        this.time.delayedCall(500, () => {
            player.setPosition(Math.max(100, player.x - 250), 200);
            player.clearTint();
            isPitStunned = false;
        });
    }

    if (isGroggy && (390 - player.y) <= 60 && player.body.velocity.y > 0) {
        canInstantRecover = true;
        groggyTime = this.time.now;
    }

    let headX = player.x, headY = player.y - (player.displayHeight / 2) - 12;
    dashBarBg.setPosition(headX, headY);
    dashBarFill.setPosition(headX - 30, headY);
    headStatusText.setPosition(headX, headY - 16);

    if (isPitStunned) headStatusText.setText('😵 구멍 낙사 스턴!').setStyle({ fill: '#ef4444' }).setVisible(true);
    else if (isGroggy) headStatusText.setText('💥 타이밍!').setStyle({ fill: '#f87171' }).setVisible(true);
    else if (isInvincible) headStatusText.setText('🌈 무적 대시!').setStyle({ fill: '#a855f7' }).setVisible(true);
    else if (isExhausted) headStatusText.setText('🌀 탈진!').setStyle({ fill: '#fb923c' }).setVisible(true);
    else headStatusText.setVisible(false);

    timerText.setText(`기록: ${formatTime(elapsedTime)}`);

    if (isExhausted && !isInvincible) {
        exhaustedTimer -= deltaSec;
        exhaustedOverlay.setAlpha((Math.sin(this.time.now / 120) + 1) * 0.15);
        if (!isGroggy) statusText.setText(`상태: 탈진 (${exhaustedTimer.toFixed(1)}s)`).setColor('#fb923c');
        if (exhaustedTimer <= 0) {
            isExhausted = false; dashEnergy = 1.0; exhaustedOverlay.setAlpha(0);
            if (!isGroggy && !isSuperDashing) { player.clearTint(); statusText.setText('상태: 정상').setColor('#34d399'); }
        }
    }

    if (!isGroggy && !isPitStunned) {
        let currentSpeed = currentBaseSpeed;

        if (isInvincible) {
            player.setVelocityX(DASH_SPEED); player.setFlipX(false);
            drawAfterimage.call(this, time); drawSpeedLines(false);
        } else if (isExhausted) {
            currentSpeed = EXHAUSTED_SPEED;
            if (cursors.right.isDown) { player.setVelocityX(currentSpeed); player.setFlipX(false); drawSpeedLines(true, 3); }
            else if (cursors.left.isDown) { player.setVelocityX(-currentSpeed); player.setFlipX(true); drawSpeedLines(false); }
            else { player.setVelocityX(0); drawSpeedLines(false); }
        } else if (ctrlKey.isDown && cursors.right.isDown) {
            dashEnergy -= deltaSec * 0.8;
            if (dashEnergy <= 0) { isExhausted = true; exhaustedTimer = 4.0; player.setTint(0xfb923c); }
            player.setVelocityX(DASH_SPEED); player.setFlipX(false);
            drawAfterimage.call(this, time); drawSpeedLines(false);
        } else {
            dashEnergy = Math.min(1.0, dashEnergy + deltaSec * 0.3);
            if (cursors.right.isDown) { player.setVelocityX(currentSpeed); player.setFlipX(false); drawSpeedLines(true, 4); }
            else if (cursors.left.isDown) { player.setVelocityX(-currentSpeed); player.setFlipX(true); drawSpeedLines(false); }
            else { player.setVelocityX(0); drawSpeedLines(false); }
        }
    }

    dashBarFill.width = isExhausted ? (exhaustedTimer / 4.0) * 60 : dashEnergy * 60;
    dashBarFill.setFillStyle(isExhausted ? 0xfb923c : (dashEnergy <= 0.2 ? 0xef4444 : 0x38bdf8));
}

function drawAfterimage(time) {
    if (time > afterimageTimer) {
        afterimageTimer = time + 60;
        let ghost = this.add.sprite(player.x, player.y, player.texture.key).setScale(player.scaleX, player.scaleY).setFlipX(player.flipX).setAlpha(0.5).setTint(0x38bdf8).setDepth(9);
        this.tweens.add({ targets: ghost, alpha: 0, duration: 250, onComplete: () => ghost.destroy() });
    }
}

function collectItem(playerObj, itemObj) {
    itemObj.destroy();
    isInvincible = true;
    statusText.setText('상태: 🌈 무적 대시 (5s)').setColor('#a855f7');
    showFloatingText.call(this, player.x, player.y - 60, '무적 자동대시 획득!', '#a855f7');

    if (invincibleEventTimer) invincibleEventTimer.remove();
    invincibleEventTimer = this.time.delayedCall(5000, () => {
        isInvincible = false; player.clearTint();
        if (!isExhausted && !isSuperDashing) statusText.setText('상태: 정상').setColor('#34d399');
    });
}

function startGameActual() {
    isGameFinished = false;
    startTime = game.scene.scenes[0].time.now;
}

function drawSpeedLines(active, lineCount = 4) {
    speedLineGraphics.clear();
    if (!active) return;
    speedLineGraphics.lineStyle(2, 0xffffff, 0.25);
    for (let i = 0; i < lineCount; i++) {
        let y = player.y + Phaser.Math.Between(-15, 15), len = Phaser.Math.Between(20, 50), x = player.x - Phaser.Math.Between(20, 60);
        speedLineGraphics.lineBetween(x, y, x - len, y);
    }
}

function showFloatingText(x, y, text, color) {
    let t = this.add.text(x, y, text, { fontFamily: 'Noto Sans KR', fontSize: '18px', fill: color, fontWeight: 'bold', stroke: '#000', strokeThickness: 4 });
    this.tweens.add({ targets: t, y: y - 50, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
}

function handleObstacleCollision(playerObj, obstacleObj) {
    if (isInvincible) {
        if (obstacleObj.destroy) obstacleObj.destroy();
        this.cameras.main.shake(100, 0.01);
        showFloatingText.call(this, obstacleObj.x, obstacleObj.y, '파괴!', '#a855f7');
        return;
    }
    if (playerObj.body.touching.down && obstacleObj.body.touching.up) {
        jumpCount = 0;
    } else if (!isGroggy) {
        applyGroggy.call(this);
    }
}

function applyGroggy() {
    isGroggy = true; canInstantRecover = false;
    player.setVelocity(-300, -300); 
    if (!isInvincible && !isSuperDashing) player.setTint(0xf87171);
    this.cameras.main.shake(200, 0.015);
    statusText.setText('상태: 💥 위험!').setColor('#f87171');

    this.time.delayedCall(1000, () => {
        if (isGroggy) {
            isGroggy = false;
            if (isExhausted && !isInvincible) { player.setTint(0xfb923c); statusText.setText('상태: 탈진').setColor('#fb923c'); }
            else if (!isInvincible && !isSuperDashing) { player.clearTint(); statusText.setText('상태: 정상').setColor('#34d399'); }
        }
    });
}

function triggerExplosiveSuperJump() {
    isGroggy = false; 
    canInstantRecover = false; 
    isSuperDashing = true;
    isInvincible = true;

    player.setVelocity(650, -650); 
    statusText.setText('상태: 🌈 무적 슈퍼대시!').setColor('#a855f7');
    showFloatingText.call(this, player.x, player.y - 50, '⚡ 슈퍼대시! (1초 무적)', '#ffea00');

    this.time.delayedCall(1000, () => {
        isSuperDashing = false;
        isInvincible = false;
        
        if (!isExhausted) { 
            player.clearTint(); 
            statusText.setText('상태: 정상').setColor('#34d399'); 
        }
    });
}

function createJumpEffect(x, y) {
    let c = this.add.circle(x, y, 10, 0xffffff, 0.8);
    this.tweens.add({ targets: c, radius: 35, alpha: 0, duration: 300, onComplete: () => c.destroy() });
}

// ==========================================
// 3. Firebase 실시간 랭킹 처리 로직
// ==========================================
function listenToRealtimeLeaderboard() {
    rankRef.orderByChild('time').limitToFirst(50).on('value', (snapshot) => {
        let board = [];
        snapshot.forEach((childSnapshot) => {
            board.push({ id: childSnapshot.key, ...childSnapshot.val() });
        });
        
        currentLeaderboardCache = board;
        updateInGameLeaderboardUI();
        renderRankingList(lastSavedRecordId);
    });
}

function saveTimeRecord(name, timeVal, comment) {
    let newRankRef = rankRef.push();
    let newRecord = {
        name: name || '익명',
        time: parseFloat(timeVal),
        comment: comment || '화이팅!',
        createdAt: firebase.database.ServerValue.TIMESTAMP
    };

    newRankRef.set(newRecord, (error) => {
        if (!error) {
            lastSavedRecordId = newRankRef.key;
        }
    });
}

function updateInGameLeaderboardUI() {
    let listEl = document.getElementById('in-game-leaderboard-list');
    if (!listEl) return;

    listEl.innerHTML = '';
    let board = currentLeaderboardCache;

    if (board.length === 0) {
        listEl.innerHTML = '<li class="empty-msg">등록된 기록이 없습니다.</li>';
        return;
    }

    let topCount = Math.min(10, board.length);
    for (let i = 0; i < topCount; i++) {
        let item = board[i];
        let isMyRecord = lastSavedRecordId && item.id === lastSavedRecordId;
        
        let li = document.createElement('li');
        if (isMyRecord) li.classList.add('my-rank-item');
        
        li.innerHTML = `
            <span class="rank-name-box">${i + 1}. ${item.name}</span>
            <span class="rank-time-box">⏱️ ${formatTime(item.time)}</span>
        `;
        listEl.appendChild(li);
    }

    if (lastSavedRecordId) {
        let myRankIndex = board.findIndex(item => item.id === lastSavedRecordId);
        if (myRankIndex >= 10) {
            let ellipsisLi = document.createElement('li');
            ellipsisLi.className = 'ellipsis-item';
            ellipsisLi.textContent = '• • •';
            listEl.appendChild(ellipsisLi);

            let myItem = board[myRankIndex];
            let myLi = document.createElement('li');
            myLi.className = 'my-rank-item';
            myLi.innerHTML = `
                <span class="rank-name-box">${myRankIndex + 1}. ${myItem.name}</span>
                <span class="rank-time-box">⏱️ ${formatTime(myItem.time)}</span>
            `;
            listEl.appendChild(myLi);
        }
    }
}

function renderRankingList(myRecordId) {
    let board = currentLeaderboardCache, listContainer = document.getElementById('ranking-list');
    if (!listContainer) return;
    listContainer.innerHTML = '';
    
    if (board.length === 0) { 
        listContainer.innerHTML = '<div style="text-align:center; color:#64748b; padding:10px;">등록된 랭킹 기록이 없습니다.</div>'; 
        return; 
    }

    board.slice(0, 10).forEach((item, index) => {
        let div = document.createElement('div');
        div.className = 'rank-item' + (item.id === myRecordId ? ' my-rank' : '');
        let commentStr = item.comment ? ` <span style="font-size:11px; color:#94a3b8; font-style:italic;">"${item.comment}"</span>` : '';
        div.innerHTML = `<span>${index + 1}위. ${item.name}${commentStr}</span> <span>⏱️ ${formatTime(item.time)}</span>`;
        listContainer.appendChild(div);
    });
}

function reachFinish(playerObj, finishObj) {
    if (isGameFinished) return;
    let rawSeconds = (this.time.now - startTime) / 1000;
    finalRecordTime = rawSeconds.toFixed(3);
    handleGameOverUI('🏆 축하합니다! 목표 완주!', `완주 기록: ${formatTime(rawSeconds)}`, true);
}

function handleGameOverUI(title, detailText, isSuccess = false) {
    isGameFinished = true;
    document.getElementById('result-title').innerText = title;
    document.getElementById('result-detail').innerText = detailText;
    document.getElementById('name-input-section').style.display = isSuccess ? 'block' : 'none';
    renderRankingList(null);
    document.getElementById('result-overlay').style.display = 'flex';
}

function resetGameVars() {
    isGroggy = false; isExhausted = false; isInvincible = false; isSuperDashing = false;
    dashEnergy = 1.0; exhaustedTimer = 0; jumpCount = 0;
    isPitStunned = false;
}

function updateKeyDisplay() {
    if (!cursors || !ctrlKey || !spaceKey) return;
    document.getElementById('key-left').classList.toggle('active', cursors.left.isDown);
    document.getElementById('key-right').classList.toggle('active', cursors.right.isDown);
    document.getElementById('key-space').classList.toggle('active', spaceKey.isDown);
    document.getElementById('key-ctrl').classList.toggle('active', ctrlKey.isDown);
}

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-overlay').style.display = 'none';
    resetGameVars(); startGameActual();
});

document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('result-overlay').style.display = 'none';
    resetGameVars(); game.scene.scenes[0].scene.restart(); startGameActual();
});

document.getElementById('save-rank-btn').addEventListener('click', () => {
    let nameInput = document.getElementById('player-name').value.trim() || '익명';
    let commentInput = document.getElementById('player-comment').value.trim() || '화이팅!';
    
    saveTimeRecord(nameInput, finalRecordTime, commentInput);
    document.getElementById('name-input-section').style.display = 'none';
});

window.onload = () => { 
    game = new Phaser.Game(config);
};
</script>
</body>
